{% extends "inc/base.html" %}

{% block page_header %}
{% endblock %}

{% block page_content %}
<div class="page-card">
    <div class="modern-form">
        <div class="form-group-modern">
            <label class="form-label-modern">OneList URL</label>
            <input type="text" id="onelist-url" class="form-control-modern" placeholder="http://192.168.1.100:5244">
        </div>
        <div class="form-group-modern">
            <label class="form-label-modern">Public Domain</label>
            <input type="text" id="onelist-domain" class="form-control-modern" placeholder="https://alist.example.com">
        </div>
        <div class="form-group-modern">
            <label class="form-label-modern">Remote Path</label>
            <input type="text" id="onelist-remote" class="form-control-modern" placeholder="/OneDriveShare">
        </div>
        <div class="form-group-modern">
            <label class="form-label-modern">Local Path</label>
            <input type="text" id="onelist-local" class="form-control-modern" placeholder="/media/alist">
        </div>
        <div class="form-group-modern">
            <label class="form-label-modern">Username</label>
            <input type="text" id="onelist-user" class="form-control-modern" placeholder="admin">
        </div>
        <div class="form-group-modern">
            <label class="form-label-modern">Password</label>
            <input type="password" id="onelist-pass" class="form-control-modern" placeholder="password">
        </div>
        <div class="form-actions-modern">
            <button id="save-onelist" class="btn-save-modern">Save Settings</button>
            <button id="run-onelist" class="btn-run-modern">Run Generator</button>
        </div>
        <div id="onelist-status"></div>
    </div>
</div>

<div id="onelist-log" class="log-output" style="display: block; visibility: visible;"></div>
{% endblock %}

{% block extra_scripts %}
<script src="/js/onelist.js" type="module"></script>
<script type="module">
    import { onelist } from '/js/onelist.js';

    document.addEventListener('DOMContentLoaded', () => {
        onelist.init();
    });
</script>
{% endblock %}
